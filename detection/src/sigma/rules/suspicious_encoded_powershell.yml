id: sigma-powershell-encoded
title: Suspicious Encoded PowerShell Execution
description: Detects execution of PowerShell with base64 or encoded command line switches.
severity: high
tags:
  - attack.t1059.001
detection:
  selection:
    event_type: process_creation
    normalized.process_name|endswith: powershell.exe
    normalized.command_line|contains:
      - " -enc "
      - " -encodedcommand "
      - " -enc"
      - " -en "
      - "-encodedcommand"
  condition: selection
